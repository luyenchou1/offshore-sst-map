name: Build currents

# Builds the /currents animation data off-Render (UMass Dartmouth NECOFS model +
# NOAA CO-OPS predictions) and uploads it to the live app via
# /api/currents/upload. Manual runs rebuild the curated hindcast weeks in
# data/currents_weeks.json. The daily schedule tries the live NECOFS forecast and
# exits quietly (success) while UMassD isn't publishing it, so "live" currents
# switch on by themselves if the forecast comes back.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "hindcast = curated weeks; forecast = latest NECOFS run"
        type: choice
        options: [hindcast, forecast]
        default: hindcast
      weeks:
        description: "Week ids from data/currents_weeks.json (comma-separated) or 'all'"
        default: all
  schedule:
    - cron: '30 12 * * *'   # daily ~08:30 ET

concurrency:
  group: build-currents
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Install build dependencies
        run: pip install -r requirements-tools.txt
      - name: Build and upload
        env:
          CACHE_UPLOAD_TOKEN: ${{ secrets.CACHE_UPLOAD_TOKEN }}
          # Inputs go through env vars, never inlined into the script.
          SOURCE: ${{ github.event_name == 'schedule' && 'forecast' || inputs.source }}
          WEEKS: ${{ inputs.weeks || 'all' }}
        run: >-
          python tools/build_currents.py --source "$SOURCE" --weeks "$WEEKS"
          --upload --base-url https://sst.gotoneapp.com
