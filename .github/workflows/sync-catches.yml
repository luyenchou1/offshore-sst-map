name: Sync GotOne catches from Firestore

# Pulls catches from Firestore, anonymizes them, and pushes the cleaned CSV to
# the live app's /api/catches/upload endpoint (hot-reload, no redeploy). Runs
# off-Render so the Firebase service account + raw PII never touch the public app.

on:
  workflow_dispatch:        # manual "Run workflow" button
  schedule:
    - cron: "0 8 * * *"     # daily at 08:00 UTC (~4am ET) — fresh each morning

concurrency:
  group: sync-catches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-cloud-firestore requests

      - name: Write service-account credentials
        env:
          GOTONE_FIREBASE_SA: ${{ secrets.GOTONE_FIREBASE_SA }}
        run: |
          printf '%s' "$GOTONE_FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Pull, anonymize, and upload
        env:
          SST_UPLOAD_URL: ${{ secrets.SST_UPLOAD_URL }}          # e.g. https://sst.gotoneapp.com
          CATCHES_UPLOAD_TOKEN: ${{ secrets.CATCHES_UPLOAD_TOKEN }}
        # --full-precision matches the gated prod map; --min-catches aborts the
        # upload (leaving the live data intact) if the pull returns too few rows.
        # If your Firestore collections aren't named "catches"/"species", add
        # --catches-collection / --species-collection.
        run: python scripts/sync_catches.py --out data --upload --full-precision --min-catches 1000

      # NOTE: the cleaned CSVs are intentionally NOT committed. This repo is
      # public and prod uses full-precision spot data, which must never enter
      # git. The app serves the uploaded data from its persistent disk instead.
