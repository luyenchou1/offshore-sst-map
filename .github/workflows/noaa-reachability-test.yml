name: noaa-reachability-test
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NOAA ERDDAP from a GitHub runner
        run: |
          echo "Runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          for h in coastwatch.pfeg.noaa.gov upwell.pfeg.noaa.gov coastwatch.noaa.gov; do
            echo "=== $h ==="
            curl -s -o /dev/null -w "  search: HTTP %{http_code} in %{time_total}s\n" \
              --max-time 25 "https://$h/erddap/search/index.csv?searchFor=MUR" \
              || echo "  search: FAILED/timeout"
          done
